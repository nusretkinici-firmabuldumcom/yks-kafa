<!-- 
    YKS Hazırlık Platformu Favicon SVG
    Basit ve temiz bir graduation cap ikonu
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <!-- Background circle -->
    <circle cx="50" cy="50" r="48" fill="url(#grad1)"/>
    
    <!-- Graduation cap -->
    <g transform="translate(50, 50)">
        <!-- Cap top (board) -->
        <polygon points="-30,-10 30,-10 35,-5 -35,-5" fill="white"/>
        
        <!-- Cap bottom -->
        <path d="M -25,-5 L -25,10 L 0,15 L 25,10 L 25,-5" fill="white" opacity="0.9"/>
        
        <!-- Tassel -->
        <line x1="30" y1="-10" x2="30" y2="5" stroke="white" stroke-width="2"/>
        <circle cx="30" cy="7" r="3" fill="white"/>
    </g>
</svg>
